
name: Extract SACCO project archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract archive
        run: |
          unzip -q FINANCE-TRUST-SACCO-MS-VERCEL.zip -d /tmp/sacco
          cp -a /tmp/sacco/FINANCE-TRUST-SACCO-MS/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract SACCO project files"
          git push
